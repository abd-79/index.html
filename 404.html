<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found (404) | IMCB G-10/4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script>
    // Smart auto-redirection for common typos
    (function() {
      const path = window.location.pathname.toLowerCase();
      if (path.includes('form')) {
        window.location.replace('Teacher%20Form.html' + window.location.search);
      } else if (path.includes('teacher')) {
        window.location.replace('teachers.html' + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="container text-center py-5">
    <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 580px; border-radius: 20px;">
      <div class="mb-4">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
      </div>
      <h1 class="h2 fw-bold text-navy mb-2">404 - Page Not Found</h1>
      <p class="text-muted mb-4">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <a href="index.html" class="btn btn-primary rounded-pill px-4">
          <i class="bi bi-house-door-fill me-1"></i> Go to Homepage
        </a>
        <a href="teachers.html" class="btn btn-outline-primary rounded-pill px-4">
          <i class="bi bi-person-video3 me-1"></i> Teachers Directory
        </a>
        <a href="Teacher%20Form.html" class="btn btn-outline-secondary rounded-pill px-4">
          <i class="bi bi-file-earmark-person me-1"></i> Teacher Form
        </a>
      </div>
    </div>
  </div>
</body>
</html>
